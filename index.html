<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product crud</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">

</head>
<body>
    <h1>Fetch Product Curd</h1>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6 mb-3">
                <div class="card">
                    <div class="card-body">
                        <form id="productForm">
                            <div class="form-group">
                                <label for="titleControl">Title :</label>
                                <input type="text" class="form-control" id="titleControl">
                            </div>
                            <div class="form-group">
                                <label for="categoryControl">Category :</label>
                                <input type="text" class="form-control" id="categoryControl">
                            </div>
                            <div class="form-group">
                                <label for="brandControl">Brand :</label>
                                <input type="text" class="form-control" id="brandControl">
                            </div>
                            <div class="form-group">
                                <label for="priceControl">Price :</label>
                                <input type="text" class="form-control" id="priceControl">
                            </div>
                            <button type="submit" class="btn btn-sm btn-block btn-primary" id="addproductBtn">Add Product</button>
                            <button type="button" class="btn btn-sm btn-block btn-danger d-none" id="updateprodutBtn">Update Product</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="row">
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th>Brand</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Title</th>
                                <th>Edit</th>
                                <th>Delete</th>
                            </tr>
                        </thead>
                        <tbody id="productContainer">
                            <!-- <tr>
                                <td>rtyui</td>
                                <td>ghjk</td>
                                <td>1234</td>
                                <td>tryfg</td>
                                <td class="text-center">
                                    <button class="btn btn-sm text-info"role="button">Edit</button>
                                </td>
                                <td class="text-center">
                                    <button class="btn btn-sm text-danger"role="button">Delete</button>
                                </td>
                            </tr> -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
   <div class="spinner d-none" id="spinner">
    <div class="spinner-border text-primary" role="status">
  <span class="sr-only">Loading...</span>
</div>

   </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>
</html>
